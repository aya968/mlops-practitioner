[project]
name = "prodml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "'aya968'", email = "'ayaali66092@gmail.com'" }
]
requires-python = ">=3.10"
dependencies = ["scikit-learn","pandas","pyarrow","fastapi","uvicorn",
"pydantic","pydantic-settings"]

[project.optional-dependencies]
dev = ["pytest","pytest-cov","ruff","black","mypy","httpx","pre-commit"]

[project.scripts]
prodml-train = "prodml.train:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/prodml --cov-report=term-missing --cov-fail-under=70"
